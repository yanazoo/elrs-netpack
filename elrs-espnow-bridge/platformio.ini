[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DESPNOW_CHANNEL=1

; Seeed Studio XIAO ESP32-C3 instead of the ESP32 Wrover-E.
; UART on Serial1: D7 / GPIO20 = RX (from the host's TX), D6 / GPIO21 = TX
; (to the host's RX), plus GND. Logs go to the USB port.
[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DESPNOW_CHANNEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUART_RX_PIN=20
    -DUART_TX_PIN=21
    -DBRIDGE_SERIAL=Serial1
