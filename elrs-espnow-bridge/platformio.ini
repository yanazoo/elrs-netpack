; No -DCORE_DEBUG_LEVEL: newer espressif32 platforms define it themselves
; (a second definition warns on every file). The bridge's own messages are
; Serial.printf and don't depend on it.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DESPNOW_CHANNEL=1

; Seeed Studio XIAO ESP32-C3 instead of the ESP32 Wrover-E.
; UART on Serial1: D7 / GPIO20 = RX (from the host's TX), D6 / GPIO21 = TX
; (to the host's RX), plus GND. Logs go to the USB port.
[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DESPNOW_CHANNEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUART_RX_PIN=20
    -DUART_TX_PIN=21
    -DBRIDGE_SERIAL=Serial1

; Seeed Studio XIAO ESP32-C5. pioarduino (Arduino-ESP32 3.3) has the C5; the
; C5 DevKitC board with the XIAO C5's pin map. UART on Serial1, the same
; header pins as the XIAO C3: D7 / GPIO12 = RX (from the host's TX),
; D6 / GPIO11 = TX (to the host's RX), plus GND. Logs go to the USB port.
; ESP-NOW stays on 2.4 GHz channel 1.
[env:xiao_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-c5-devkitc-1
board_build.variant = XIAO_ESP32C5
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DESPNOW_CHANNEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUART_RX_PIN=12
    -DUART_TX_PIN=11
    -DBRIDGE_SERIAL=Serial1

; The XIAO C5 of an FPV C5 Lap Timer made into a netpack (the netpack's
; env xiao_esp32s3_timerwiring): the timer's own UART wires, the pins
; FPVGate C5MK uses. D4 / GPIO23 = RX (from the S3's D3 / GPIO4),
; D5 / GPIO24 = TX (to the S3's D4 / GPIO5), plus GND.
[env:xiao_esp32c5_timerwiring]
extends = env:xiao_esp32c5
build_flags =
    -DESPNOW_CHANNEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUART_RX_PIN=23
    -DUART_TX_PIN=24
    -DBRIDGE_SERIAL=Serial1
