[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; upload_port = COM3   ← デバイスマネージャーで確認した番号に変更してコメントアウトを外す
extra_scripts = pre:build_info.py
; The web server (as FPV C5 Lap Timer): several connections at once.
lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.10
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.11.2

; An FPV C5 Lap Timer made into a netpack: the same firmware on the timer's
; own wiring (its XIAO C5 runs the ESP-NOW bridge, env
; xiao_esp32c5_timerwiring of elrs-espnow-bridge). The pins are in
; include/config.h (NP_TIMER_WIRING). Its online update takes
; elrs-netpack-xiao_esp32s3-timerwiring-firmware.bin.
[env:xiao_esp32s3_timerwiring]
extends = env:xiao_esp32s3
build_flags =
    -DNP_TIMER_WIRING=1
